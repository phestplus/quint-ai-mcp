# Publishes to npm with Trusted Publishing (OIDC, no tokens) when a version tag is pushed,
# e.g. `git tag v0.3.1 && git push origin v0.3.1`. Configure the trusted publisher on
# npmjs.com: package quint-ai-mcp > Settings > Trusted Publisher > GitHub Actions,
# owner phestplus, repository quint-ai-mcp, workflow release.yml.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm trusted publishing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Tag must match package.json version
        run: |
          V="v$(node -p "require('./package.json').version")"
          if [ "$V" != "$GITHUB_REF_NAME" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json $V"; exit 1; fi

      - name: Publish to npm (skipped if this version is already published)
        run: |
          V="$(node -p "require('./package.json').version")"
          # npm view can exit 0 with empty output for a version that does not exist, so compare the text.
          if [ "$(npm view "quint-ai-mcp@$V" version 2>/dev/null)" = "$V" ]; then
            echo "quint-ai-mcp@$V is already on npm, skipping publish"
            exit 0
          fi
          # A re-run right after a publish can hit npm while the version is still being processed
          # ("previously staged"): that version is already on its way, so it counts as success.
          set +e
          npm publish --access public > publish.log 2>&1
          rc=$?
          set -e
          cat publish.log
          if [ $rc -ne 0 ]; then
            if grep -qiE "E409|previously staged|cannot publish over" publish.log; then
              echo "quint-ai-mcp@$V was already published and is still being processed by npm."
            else
              exit $rc
            fi
          fi

      - name: GitHub release with notes from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(node -p "require('./package.json').version")"
          node -e "const s=require('fs').readFileSync('CHANGELOG.md','utf8');const m=s.split(/^## /m).find(x=>x.startsWith('$V'));require('fs').writeFileSync('notes.md',m?m.split('\n').slice(1).join('\n').trim():'See CHANGELOG.md')"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Quint AI $GITHUB_REF_NAME" --notes-file notes.md
